<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 498" width="860" role="img" aria-labelledby="t d"><title id="t">Speed-up of each kept change</title><desc id="d">Generated tokens per second, before against after, on a GTX 1660 Ti 6 GB.</desc><style>
:root{--bg:#fbfcfc;--fg:#15202a;--mute:#566673;--track:#e2e7ea;--cfg:#0b7a75;--spec:#3b5bdb;--hw:#b7791f;--base:#9aa8b2;--line:#d3dade;--ok:#1c8a4a;--bad:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#0f161b;--fg:#e4ebef;--mute:#8fa0ab;--track:#222e36;--cfg:#3fc9bf;--spec:#8da2f5;--hw:#e0a94a;--base:#5d7080;--line:#27343d;--ok:#4cc27f;--bad:#ef7566}}
text{font-family:ui-sans-serif,"Segoe UI",system-ui,sans-serif;fill:var(--fg)}
.m{font-family:ui-monospace,Menlo,Consolas,monospace;fill:var(--mute);font-size:12px}
.mx{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:16px;font-weight:600}
.t{font-size:13px}.h{font-size:22px;font-weight:700}
</style><rect width="860" height="498" fill="var(--bg)" rx="8"/><text x="24" y="36" class="h">What the tuning bought on a 6 GB card</text><text x="24" y="56" class="m">speed-up in generated tokens per second, kept changes only. Dashed line is 1x.</text><text x="24" y="84" class="t">9B code edit, speculative decoding</text><text x="768" y="84" class="m" text-anchor="end">24.1 to 169.6 t/s</text><rect x="24" y="92" width="752" height="16" rx="2" fill="var(--track)"/><rect x="24" y="92" width="705.6" height="16" rx="2" fill="var(--spec)"/><text x="790" y="106" class="mx">7.04x</text><text x="24" y="136" class="t">3B code edit, speculative decoding</text><text x="768" y="136" class="m" text-anchor="end">86.7 to 273.7 t/s</text><rect x="24" y="144" width="752" height="16" rx="2" fill="var(--track)"/><rect x="24" y="144" width="316.5" height="16" rx="2" fill="var(--spec)"/><text x="790" y="158" class="mx">3.16x</text><text x="24" y="188" class="t">7B, 15K context, more layers + 4-bit values</text><text x="768" y="188" class="m" text-anchor="end">18.2 to 32.9 t/s</text><rect x="24" y="196" width="752" height="16" rx="2" fill="var(--track)"/><rect x="24" y="196" width="181.3" height="16" rx="2" fill="var(--cfg)"/><text x="790" y="210" class="mx">1.81x</text><text x="24" y="240" class="t">7B, empty context, more layers + 4-bit values</text><text x="768" y="240" class="m" text-anchor="end">35.1 to 53.7 t/s</text><rect x="24" y="248" width="752" height="16" rx="2" fill="var(--track)"/><rect x="24" y="248" width="153.4" height="16" rx="2" fill="var(--cfg)"/><text x="790" y="262" class="mx">1.53x</text><text x="24" y="292" class="t">7B, 4K context, GPU clocks + 120 W</text><text x="768" y="292" class="m" text-anchor="end">43.8 to 50.7 t/s</text><rect x="24" y="300" width="752" height="16" rx="2" fill="var(--track)"/><rect x="24" y="300" width="116.1" height="16" rx="2" fill="var(--hw)"/><text x="790" y="314" class="mx">1.16x</text><text x="24" y="344" class="t">9B, 15K context, more layers</text><text x="768" y="344" class="m" text-anchor="end">15.2 to 17.7 t/s</text><rect x="24" y="352" width="752" height="16" rx="2" fill="var(--track)"/><rect x="24" y="352" width="116.8" height="16" rx="2" fill="var(--cfg)"/><text x="790" y="366" class="mx">1.16x</text><text x="24" y="396" class="t">9B, empty context, more layers</text><text x="768" y="396" class="m" text-anchor="end">21.3 to 24.6 t/s</text><rect x="24" y="404" width="752" height="16" rx="2" fill="var(--track)"/><rect x="24" y="404" width="115.8" height="16" rx="2" fill="var(--cfg)"/><text x="790" y="418" class="mx">1.15x</text><line x1="124.3" x2="124.3" y1="82" y2="428" stroke="var(--mute)" stroke-dasharray="3 3"/><rect x="24" y="462" width="10" height="10" rx="2" fill="var(--spec)"/><text x="40" y="472" class="m">speculative decoding</text><rect x="224" y="462" width="10" height="10" rx="2" fill="var(--cfg)"/><text x="240" y="472" class="m">layers and KV cache setting</text><rect x="454" y="462" width="10" height="10" rx="2" fill="var(--hw)"/><text x="470" y="472" class="m">GPU clocks</text></svg>