# What assess.py reports. Every number is a reference into results/, so the report cannot drift from the measurements.
# To reuse on another machine: run the benchmarks there, then point these lines at your own result files.
#
# Reference forms
#   bench:<file>:<model file starts with>:<ngl>:<pp|tg>      a bench.sh csv (results/<file>.csv)
#   compare:<plan>:<label>:<pp|tg>@<depth>                   a compare.py csv (results/compare-<plan>.csv)
#   spec:<label>:<variant>:<prompt>                          a spectest.py csv, mean writing speed
#   log:<file>:<step>                                        a gpu-push.py log, decode speed of that step (last match)
#   suite:<run>:<model>:<metric>                             a suite.py csv

